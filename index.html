</head>

  <div class="bar-controls">
    <select id="lang" data-i18n-aria="app.language" aria-label="Idioma"></select>
    <select id="device" data-i18n-aria="app.device" aria-label="Dispositivo de entrada"></select>
    <button id="toggle" class="primary" data-i18n="app.start">Iniciar</button>
  </div>
  <div id="status" class="status" role="status" data-i18n="app.permissionHint"></div>
  <div id="diag" class="diag" role="status" hidden></div>
</header>

<main>
  <div id="cal-banner" class="banner" role="status" hidden>
    <div class="banner-body">
      <strong id="cb-title"></strong>
      <span id="cb-text"></span>
    </div>
    <div class="banner-actions">
      <button id="cb-adopt" class="primary" data-i18n="banner.adopt" hidden></button>
      <button id="cb-start" class="primary" data-i18n="banner.calibrateNow"></button>
      <button id="cb-apply" class="primary" data-i18n="cal.applyBtn" hidden></button>
      <button id="cb-cancel" class="ghost" data-i18n="banner.cancel" hidden></button>
      <button id="cb-hide" class="ghost" data-i18n="banner.notNow"></button>
    </div>
  </div>

  <section class="tiles" data-i18n-aria="app.readings" aria-label="Lecturas">
    <div class="tile">
      <div class="tile-label"><span data-i18n="tile.rate"></span><button type="button" class="info" data-info="info.rate" data-i18n-aria="info.more"></button></div>
      <div class="tile-value" id="v-rate">—</div>
      <div class="tile-unit" data-i18n="tile.rateUnit"></div>
      <div class="chip" id="c-rate"><span class="dot"></span><span class="chip-text"></span></div>
      <div class="tile-note" id="n-rate"></div>
    </div>
    <div class="tile">
      <div class="tile-label"><span data-i18n="tile.amplitude"></span><button type="button" class="info" data-info="info.amplitude" data-i18n-aria="info.more"></button></div>
      <div class="tile-value" id="v-amp">—</div>
      <div class="tile-unit" data-i18n="tile.amplitudeUnit"></div>
      <div class="chip" id="c-amp"><span class="dot"></span><span class="chip-text"></span></div>
      <div class="tile-note" id="n-amp"></div>
    </div>
    <div class="tile">
      <div class="tile-label"><span data-i18n="tile.beat"></span><button type="button" class="info" data-info="info.beat" data-i18n-aria="info.more"></button></div>
      <div class="tile-value" id="v-beat">—</div>
      <div class="tile-unit" data-i18n="tile.beatUnit"></div>
      <div class="chip" id="c-beat"><span class="dot"></span><span class="chip-text"></span></div>
      <div class="tile-note" id="n-beat"></div>
    </div>
    <div class="tile">
      <div class="tile-label"><span data-i18n="tile.bph"></span><button type="button" class="info" data-info="info.bph" data-i18n-aria="info.more"></button></div>
      <div class="tile-value" id="v-bph">—</div>
      <div class="tile-unit" data-i18n="tile.bphUnit"></div>
      <div class="chip" id="c-bph"><span class="dot"></span><span class="chip-text"></span></div>
      <div class="tile-note" id="n-bph"></div>
    </div>
  </section>

  <section class="card positions-card">
    <div class="card-head">
      <h2 data-i18n="pos.section"></h2><button type="button" class="info" data-info="info.positions" data-i18n-aria="info.more"></button>
      <input id="pos-ref" class="ref-input" data-i18n-placeholder="pos.reference" maxlength="60">
      <div class="card-tools">
        <button id="pos-copy" class="ghost" data-i18n="pos.copy"></button>
        <button id="pos-csv" class="ghost" data-i18n="pos.csv"></button>
        <button id="pos-clear" class="ghost" data-i18n="pos.clearAll"></button>
      </div>
    </div>
    <p class="hint" data-i18n="pos.hint"></p>
    <div id="pos-grid" class="pos-grid"></div>
    <div id="pos-summary" class="pos-summary"></div>
  </section>

  <section class="panels">
    <div class="card tape-card">
      <div class="card-head">
        <h2 data-i18n="tape.section"></h2><button type="button" class="info" data-info="info.tape" data-i18n-aria="info.more"></button>
        <div class="legend">
          <span class="key"><i style="background:var(--s1)"></i><span data-i18n="tape.tic"></span></span>
          <span class="key"><i style="background:var(--s2)"></i><span data-i18n="tape.tac"></span></span>
        </div>
        <div class="card-tools">
          <label><span data-i18n="tape.range"></span>
            <select id="tape-range">
              <option value="2.5">±2,5 ms</option>
              <option value="5" selected>±5 ms</option>
              <option value="10">±10 ms</option>
            </select>
          </label>
          <label><span data-i18n="tape.span"></span>
            <select id="tape-span">
              <option value="15">15 s</option>
              <option value="30" selected>30 s</option>
              <option value="60">60 s</option>
            </select>
          </label>
        </div>
      </div>
      <canvas id="tape" data-i18n-aria="tape.alt" aria-label="Traza de la cinta de papel"></canvas>
      <p class="hint" data-i18n="tape.hint"></p>
    </div>

    <div class="card charts-card">
      <div class="card-head">
        <h2 data-i18n="chart.section"></h2><button type="button" class="info" data-info="info.charts" data-i18n-aria="info.more"></button>
        <div class="card-tools">
          <label><span data-i18n="chart.window"></span>
            <select id="chart-span">
              <option value="60">1 min</option>
              <option value="300" selected>5 min</option>
              <option value="900">15 min</option>
              <option value="3600">60 min</option>
            </select>
          </label>
          <button id="btn-table" class="ghost" data-i18n="chart.showData" aria-expanded="false"></button>
        </div>
      </div>
      <canvas id="ch-rate" class="chart"></canvas>
      <canvas id="ch-amp" class="chart"></canvas>
      <canvas id="ch-beat" class="chart"></canvas>
      <div id="table-wrap" class="table-wrap" hidden>
        <table id="table">
          <caption data-i18n="chart.caption"></caption>
          <thead><tr>
            <th data-i18n="chart.colTime"></th>
            <th data-i18n="chart.colRate"></th>
            <th data-i18n="chart.colAmp"></th>
            <th data-i18n="chart.colBeat"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="settings">
    <details open>
      <summary data-i18n="set.measure"></summary>
      <div class="grid">
        <label class="field">
          <span data-i18n="set.bph"></span>
          <div class="row">
            <label class="inline"><input type="checkbox" id="bph-auto" checked> <span data-i18n="set.auto"></span></label>
            <select id="bph-manual"></select>
          </div>
        </label>
        <label class="field">
          <span data-i18n="set.lift"></span><button type="button" class="info" data-info="info.lift" data-i18n-aria="info.more"></button>
          <div class="row">
            <input type="number" id="lift" value="52" min="20" max="80" step="0.5">
            <select id="lift-preset"></select>
          </div>
          <small data-i18n="set.liftHelp"></small>
        </label>
        <label class="field">
          <span data-i18n="set.fitWindow"></span>
          <select id="fit-window">
            <option value="10">10 s</option>
            <option value="20" selected>20 s</option>
            <option value="30">30 s</option>
            <option value="60">60 s</option>
          </select>
          <small data-i18n="set.fitWindowHelp"></small>
        </label>
      </div>
    </details>

    <details>
      <summary data-i18n="set.probe"></summary>
      <div class="grid">
        <label class="field">
          <span data-i18n="set.band"></span>
          <div class="row">
            <input type="number" id="band-lo" value="1000" min="100" max="10000" step="100">
            <span class="sep">–</span>
            <input type="number" id="band-hi" value="8000" min="1000" max="22000" step="500">
            <button id="btn-autotune" class="ghost" data-i18n="set.tune"></button>
          </div>
          <small data-i18n="set.bandHelp"></small>
        </label>
        <label class="field">
          <span data-i18n="set.sens"></span>
          <input type="range" id="sens" min="3" max="40" step="1" value="12">
          <small id="sens-note"></small>
        </label>
        <label class="field">
          <span data-i18n="set.quality"></span><button type="button" class="info" data-info="info.quality" data-i18n-aria="info.more"></button>
          <div class="meter"><div id="quality-bar"></div></div>
          <small id="quality-note"></small>
        </label>
        <label class="field">
          <span data-i18n="set.ampThr"></span>
          <input type="range" id="amp-thr" min="3" max="25" step="1" value="8">
          <small id="amp-thr-note"></small>
        </label>
        <label class="field">
          <span data-i18n="set.align"></span>
          <label class="inline"><input type="checkbox" id="align" checked> <span data-i18n="set.alignOn"></span></label>
          <small data-i18n="set.alignHelp"></small>
        </label>
      </div>
    </details>

    <details id="cal-details">
      <summary><span data-i18n="cal.section"></span><button type="button" class="info" data-info="info.calibration" data-i18n-aria="info.more"></button></summary>
      <div class="cal">
        <p class="cal-why" data-i18n-html="cal.why"></p>
        <div class="cal-state">
          <div><span class="k" data-i18n="cal.active"></span><span class="v" id="cal-active"></span></div>
          <div><span class="k" data-i18n="cal.source"></span><span class="v" id="cal-source">—</span></div>
          <div><span class="k" data-i18n="cal.bias"></span><span class="v" id="cal-bias">—</span></div>
        </div>
        <div class="cal-run">
          <button id="btn-cal" class="ghost" data-i18n="cal.startBtn"></button>
          <button id="btn-cal-apply" class="ghost" data-i18n="cal.applyBtn" disabled></button>
          <button id="btn-cal-clear" class="ghost" data-i18n="cal.deleteBtn"></button>
        </div>
        <div class="cal-stored">
          <div class="cal-stored-head" data-i18n="cal.storedHead"></div>
          <div id="cal-list" class="cal-list"></div>
          <small data-i18n-html="cal.storedHelp"></small>
        </div>
        <div class="cal-live" id="cal-live" data-i18n-html="cal.idleHelp"></div>
      </div>
    </details>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
